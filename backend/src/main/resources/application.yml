server:
  port: 8080

spring:
  application:
    name: classmanage-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.17.100:3306/class_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 自定义配置
classmanage:
  jwt:
    # 生产环境请修改密钥
    secret: classmanage-jwt-secret-key-please-change-in-production-2026
    expire-hours: 2
  file:
    upload-dir: uploads/

logging:
  level:
    com.classmanage: debug
